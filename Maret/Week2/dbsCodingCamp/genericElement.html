<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="genericElement.css" />
    <title>DIV</title>
  </head>
  <body>
    <div>
      <h1>Ini adalah contoh menggunakan div</h1>
      <div class="shadowbox">
        <p>
          Paragraf ini berada di dalam elemen div, tetapi ia akan ditampilkan
          sama seperti paragraf biasanya. Elemen ini lebih sering digunakan
          untuk mengelompokkan sebuah konten sehingga dapat memudahkan styling
          dengan menggunakan atribut class atau id.
        </p>
      </div>
    </div>

    <form method="post" action="https://www.example.com/">
      <div>
        <label for="email">Email</label>
        <br />
        <input type="email" id="email" name="email" value="" />
      </div>

      <div>
        <label for="password">password</label>
        <br />
        <input type="password" id="password" name="password" value="" />
      </div>
      <button type="submit">submit</button>
    </form>
  </body>
</html>
