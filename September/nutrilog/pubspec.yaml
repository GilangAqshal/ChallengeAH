name: nutrilog
description: NutriLog - aplikasi pencatat nutrisi harian (Flutter + Supabase).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  google_fonts: ^6.2.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # Setelah mengekspor aset dari Figma (lihat README), hapus tanda # di bawah:
